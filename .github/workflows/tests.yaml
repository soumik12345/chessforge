name: Unit Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version-file: uv.lock
          python-version: "3.13"
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --locked --no-default-groups --group test --extra cpu
      - name: Run unit tests
        run: uv run --no-sync python -m pytest tests -q
